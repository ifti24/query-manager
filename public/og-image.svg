  <!-- Sub description -->
  <text x="100" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#64748b">Structured query management for managers who need</text>
  <text x="100" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#64748b">accountability from their teams — not excuses.</text>

  <!-- Pill badges -->
