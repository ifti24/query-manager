  <polygon points="117,245 117,258 131,245" fill="#f59e0b"/>

  <!-- Brand name -->
  <text x="192" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" letter-spacing="-1">QueryPing</text>

