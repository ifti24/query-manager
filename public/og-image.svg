  <rect x="768" y="218" width="100" height="64" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="818" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#fbbf24" text-anchor="middle">9</text>
  <text x="818" y="268" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Open</text>

  <rect x="880" y="218" width="100" height="64" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
