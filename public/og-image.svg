  <text x="784" y="316" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#475569">#Q-22</text>
  <text x="840" y="316" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#cbd5e1">Shipment delay — April 28</text>
  <rect x="992" y="304" width="64" height="22" rx="11" fill="#064e3b"/>
  <text x="1024" y="319" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#34d399" text-anchor="middle" font-weight="bold">Answered</text>
  <text x="784" y="332" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#334155">Assigned to Rafiq A. · 1h ago</text>

  <rect x="768" y="352" width="324" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="784" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#475569">#Q-21</text>
  <text x="840" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#cbd5e1">Vendor payment reconciliation</text>
  <rect x="992" y="358" width="64" height="22" rx="11" fill="#451a03"/>
  <text x="1024" y="373" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="bold">Pending</text>
  <text x="784" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#334155">Assigned to Nadia I. · 4h ago</text>

  <rect x="768" y="406" width="324" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="784" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#475569">#Q-20</text>
  <text x="840" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#cbd5e1">March stock count discrepancy</text>
  <rect x="992" y="412" width="64" height="22" rx="11" fill="#450a0a"/>
  <text x="1024" y="427" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#f87171" text-anchor="middle" font-weight="bold">Overdue</text>
  <text x="784" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#334155">Assigned to Mahbub H. · 2d ago</text>

  <!-- Bottom domain -->
