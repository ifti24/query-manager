  <rect x="472" y="472" width="190" height="44" rx="22" fill="#0f2a1e"/>
  <text x="567" y="499" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#34d399" text-anchor="middle" font-weight="bold">Setup in 2 Minutes</text>

